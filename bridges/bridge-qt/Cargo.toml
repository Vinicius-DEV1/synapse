[package]
name = "synapse-bridge-qt"
version = "0.1.0"
edition = "2021"
authors = ["Vinicius Calado <https://github.com/Vinicius-DEV1>"]
license = "BSL-1.1"

[lib]
name = "synapse_bridge_qt"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
synapse-core = { path = "../../core/synapse-core" }
chrono = { version = "0.4.38", features = ["serde"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde_json = "1.0"
hex = "0.4"
libc = "0.2"
zeroize = "1.8"
