[package]
name = "synapse-bridge-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "synapse_bridge_wasm"

[dependencies]
synapse-core = { path = "../../core/synapse-core", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
chrono = { version = "0.4.38", features = ["serde", "wasmbind"] }
hex = "0.4"
getrandom = { version = "0.2", features = ["js"] }
