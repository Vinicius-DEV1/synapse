[package]
name = "synapse-bridge-uniffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "synapse_bridge_uniffi"

[features]
bindgen-cli = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[dependencies]
synapse-core = { path = "../../core/synapse-core" }
uniffi = "0.28"
thiserror = "1.0"
hex = "0.4"
chrono = { version = "0.4.38", features = ["serde"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.10"
