[package]
name = "synapse-core"
version = "0.1.0"
edition = "2021"
authors = ["Vinicius Calado <https://github.com/Vinicius-DEV1>"]
license = "BSL-1.1"
description = "Synapse Core - Pure business logic, SQLite database, E2EE vault crypto and FSRS engine"

[lib]
name = "synapse_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["db"]
db = ["dep:rusqlite"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
markup5ever = "0.39.0"
uuid = { version = "1.8.0", features = ["v4", "js"] }
chrono = { version = "0.4.38", features = ["serde"] }
aes-gcm = "0.10.3"
pbkdf2 = "0.12.2"
sha2 = "0.10.8"
rand = "0.8.5"
hex = "0.4.3"
log = "0.4"
dirs = "5.0.1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3.10"

