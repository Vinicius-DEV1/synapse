name: CI Quality Gates

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type Integrity, Lint & Critical Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript Strict Contract Verification
        run: npx tsc -b --noEmit

      - name: 🧹 ESLint Code Quality Verification
        run: npm run lint

      - name: 🔒 Critical Cryptographic & E2EE Unit Tests
        run: npx vitest run src/services/crypto.test.ts
