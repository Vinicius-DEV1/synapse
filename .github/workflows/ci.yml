name: CI Quality Gates

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Type Integrity, Lint & Critical Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔍 TypeScript Strict Contract Verification
        run: npm run typecheck

      - name: 🧹 ESLint Code Quality Verification
        run: npm run lint

      - name: 🔒 Core Cryptographic, Sync & Platform Integration Tests with Coverage
        run: npm run test -- src/services/crypto.test.ts src/services/sync/ src/store/focus/ src/hooks/useAppBackPress.test.ts src/services/platform.test.ts src/api/web/sync.test.ts src/services/db-web.test.ts --coverage

      - name: 🏗️ Production Bundle Build
        run: npm run build

      - name: 🎯 Performance Budget Gate Enforcement
        run: npm run check:budgets

  benchmark:
    name: Automated Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: ⚡ Run Reproducible Benchmark Suite
        run: npm run benchmark

      - name: 📊 Upload Benchmark Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: apps/web-react/benchmark-results.json
